<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plate Ledger</title>
<meta name="description" content="Personal calorie and macro tracker with Canadian Nutrient File and USDA foods, photo estimates by Claude, weight and activity log.">
<meta name="theme-color" content="#0E7C5B" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1512" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plate Ledger">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface2:#E9EDEB; --line:#D5DCD8;
  --ink:#16201B; --ink2:#5B6862; --ink3:#8A948F;
  --accent:#0E7C5B; --accent-ink:#FFFFFF; --accent-soft:#DDF0E8;
  --p:#3B6FD6; --c:#D98A1F; --f:#C4536B; --over:#C0392B; --ok:#0E7C5B;
  --shadow:0 6px 24px rgba(22,32,27,.10);
  --radius:14px;
  --display:"Manrope",system-ui,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1512; --surface:#18211D; --surface2:#222C27; --line:#2E3A34;
    --ink:#EDF2EF; --ink2:#A7B3AD; --ink3:#6F7B75;
    --accent:#3CC493; --accent-ink:#0B1610; --accent-soft:#173328;
    --p:#6E96F0; --c:#EBA84A; --f:#E07A90; --over:#F07A6E; --ok:#3CC493;
    --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211D; --surface2:#222C27; --line:#2E3A34;
  --ink:#EDF2EF; --ink2:#A7B3AD; --ink3:#6F7B75;
  --accent:#3CC493; --accent-ink:#0B1610; --accent-soft:#173328;
  --p:#6E96F0; --c:#EBA84A; --f:#E07A90; --over:#F07A6E; --ok:#3CC493;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700}
.app{max-width:600px;margin:0 auto;padding:0 16px calc(84px + env(safe-area-inset-bottom,0px));min-height:100%}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.topbar h1{font-size:20px;font-weight:800}
.datenav{display:flex;align-items:center;gap:4px}
.datenav button{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:grid;place-items:center}
.datenav .dl{font-family:var(--display);font-weight:700;font-size:14px;min-width:112px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;height:36px;line-height:34px;padding:0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.stack{display:flex;flex-direction:column;gap:14px}
/* summary */
.summary{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:420px){.summary{grid-template-columns:128px 1fr}}
.ring{position:relative;width:100%;aspect-ratio:1;max-width:100%}
.ring svg{width:100%;height:100%;display:block}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:30px;line-height:1}
.ring .sub{font-size:11px;color:var(--ink2);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.macros{display:flex;flex-direction:column;gap:10px}
.macro .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:4px}
.macro .lbl b{color:var(--ink);font-family:var(--display);font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .35s ease}
.macro.p .bar i{background:var(--p)} .macro.c .bar i{background:var(--c)} .macro.f .bar i{background:var(--f)}
.bar i.over{background:var(--over)}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.mini{font-size:12px;color:var(--ink2)} .mini b{display:block;font-family:var(--display);font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
/* meals */
.meal{padding:0;overflow:hidden}
.meal header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.meal header h3{font-size:15px;font-weight:700}
.meal header .kc{color:var(--ink2);font-size:13px;font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600}
.meal .add{background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:6px 12px;font-weight:600;font-size:13px;font-family:var(--display)}
.entry{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:center;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0}
.entry:last-child{border-bottom:0}
.entry .n{font-weight:500;overflow-wrap:anywhere;grid-column:1;grid-row:1}
.entry .d{font-size:12px;color:var(--ink2);grid-column:1;grid-row:2}
.entry .k{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;grid-column:2;grid-row:1/3;align-self:center}
.entry .src{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink3);margin-left:6px}
.empty{padding:12px 16px;color:var(--ink3);font-size:13px}
/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tabbar button{background:none;border:0;border-radius:10px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink2);font-family:var(--display);font-weight:600}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--accent);background:var(--accent-soft)}
.screen[hidden]{display:none}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,13,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92vh;max-height:92dvh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sheet .hd h2{font-size:17px}
.sheet .bd{overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.sheet .ft{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px}
.x{background:var(--surface2);border:0;border-radius:999px;width:32px;height:32px;display:grid;place-items:center}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-family:var(--display);font-weight:600;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-family:var(--display);font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-ink);flex:1}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:none;color:var(--over);flex:0 0 auto}
.btn:disabled{opacity:.5;cursor:default}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--ink2);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
.field textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 12px}
.search input{border:0;background:none;padding:11px 0;flex:1;min-width:0}
.results{display:flex;flex-direction:column}
.res{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.res .n{font-weight:500;overflow-wrap:anywhere;grid-column:1;grid-row:1} .res .g{font-size:12px;color:var(--ink2);grid-column:1;grid-row:2}
.res .k{font-family:var(--display);font-weight:700;grid-column:2;grid-row:1/3;align-self:center;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}
.hint{font-size:12px;color:var(--ink3)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--surface2);border:0;border-radius:999px;padding:6px 10px;font-size:13px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.preview{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:12px}
.preview .big{font-size:26px}
.nutgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;color:var(--ink2)}
.nutgrid b{display:block;color:var(--ink);font-family:var(--display);font-variant-numeric:tabular-nums}
.photo-drop{border:2px dashed var(--line);border-radius:14px;padding:22px 14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink2)}
.photo-drop img{max-height:220px;border-radius:10px;max-width:100%}
.photo-drop button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:10px 18px;font-family:var(--display);font-weight:700}
.est{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.est .it{display:grid;grid-template-columns:1fr 84px 64px;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.est .it:last-child{border-bottom:0}
.est .it input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:100%;font-variant-numeric:tabular-nums}
.est .it .k{text-align:right;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.est .it .n{font-size:14px;overflow-wrap:anywhere} .est .it .n small{display:block;color:var(--ink3);font-size:11px}
.status{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:8px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.bar i{transition:none}}
/* trends */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink2);font-family:var(--display);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--ink2)}
.kpi b{display:block;font-family:var(--display);font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.li:last-child{border-bottom:0}
.li .s{font-size:12px;color:var(--ink2)}
.li button.del{background:none;border:0;color:var(--over);font-size:13px;font-family:var(--display);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:14px;z-index:30;box-shadow:var(--shadow)}
.note{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:13px}
.warn{background:var(--surface2);color:var(--ink2);border-radius:12px;padding:10px 12px;font-size:13px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.section-h h2{font-size:16px}
.section-h .hint{font-family:var(--display);font-weight:600}
</style>

</head>
<body>
<div class="app">
  <div class="topbar">
    <h1 id="screenTitle">Today</h1>
    <div class="datenav" id="datenav">
      <button id="prevDay" aria-label="Previous day">&#8249;</button>
      <button class="dl" id="dateLabel" aria-label="Pick a date">Today</button>
      <button id="nextDay" aria-label="Next day">&#8250;</button>
    </div>
  </div>

  <section class="screen stack" id="scr-today"></section>
  <section class="screen stack" id="scr-trends" hidden></section>
  <section class="screen stack" id="scr-foods" hidden></section>
  <section class="screen stack" id="scr-settings" hidden></section>
</div>

<nav class="tabbar" aria-label="Sections"><div class="in">
  <button data-tab="today" class="on"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v10h12V10"/></svg>Today</button>
  <button data-tab="trends"><svg viewBox="0 0 24 24"><path d="M4 18 10 11l4 4 6-8"/><path d="M4 21h16"/></svg>Trends</button>
  <button data-tab="foods"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>Foods</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.3 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.4 2.6a7 7 0 0 0-1.7 1l-2.3-1-2 3.4 2 1.5a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 1.7 1l.4 2.6h5l.4-2.6a7 7 0 0 0 1.7-1l2.3 1 2-3.4-2-1.5c.07-.33.1-.66.1-1z"/></svg>Settings</button>
</div></nav>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<input type="file" id="fileInput" accept="image/*" hidden>

<script src="app.js"></script>
</body>
</html>
